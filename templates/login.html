{% extends 'base.html' %}

{% block title %}Login - SajidXP{% endblock %}

{% block content %}
<section class="auth-section">
    <div class="auth-card">
        <h2>Login</h2>

        <form action="{% url 'login' %}" method="post">
            {% csrf_token %}
            <input type="hidden" name="next" value="{{ next }}">
            {% include 'form_fields.html' %}
            <button type="submit" class="site-btn">Login</button>
        </form>

        <p class="auth-switch">Don't have an account? <a href="{% url 'register' %}">Register here</a></p>
    </div>
</section>
{% endblock %}
